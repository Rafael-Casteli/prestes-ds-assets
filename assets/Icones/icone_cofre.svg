<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Ícone cofre — Design System Prestes (mesma regra da biblioteca: 200 × 200, traço 8, pontas e cantos arredondados).
       Camadas separadas para animar: corpo, conteudo (abertura), porta (com mecanismo e emblema).
       A porta gira na dobradiça em x = 46 (lado esquerdo). O emblema é opcional:
       construtora = símbolo Prestes · empreendimento = edifício (ver prestes-patrimonio-afetacao.js, função cofre()). -->
  <g fill="none" stroke="#044d41" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <g id="corpo">
      <path d="M50 16 H150 Q170 16 170 36 V150 Q170 170 150 170 H50 Q30 170 30 150 V36 Q30 16 50 16 Z"/>
      <path d="M54 170 V180 M146 170 V180"/>
      <path d="M38 52 V68 M38 118 V134"/>
    </g>
    <g id="conteudo">
      <rect x="50" y="36" width="100" height="114" rx="6" stroke="none"/>
    </g>
    <g id="porta">
      <path d="M56 32 H144 Q154 32 154 42 V144 Q154 154 144 154 H56 Q46 154 46 144 V42 Q46 32 56 32 Z"/>
      <g id="mecanismo">
        <circle cx="100" cy="106" r="22"/>
        <path d="M100 106 V84 M100 106 L81 117 M100 106 L119 117"/>
        <path d="M126 106 H140"/>
      </g>
      <g id="emblema"/>
    </g>
  </g>
</svg>
